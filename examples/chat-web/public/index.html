<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sigil-native · chat-web</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app">
      <aside id="sidebar">
        <div class="sb-top">
          <button id="new-chat" class="sb-new">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            新聊天
          </button>
        </div>
        <div id="chat-list"></div>
        <div class="sb-footer">
          <div class="user-chip">
            <div class="user-avatar">S</div>
            <span>sigil-native</span>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button id="toggle-sb" class="icon-btn" title="收起侧栏">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
          <span id="model-name" class="model-name">sigil-native</span>
          <span id="conn-badge" class="conn-badge"></span>
        </header>

        <div id="chat">
          <div id="empty-state">
            <h1>有什么可以帮忙的？</h1>
            <div class="starter-cards">
              <button data-q="帮我做一个团队定价的滑块小组件">💰 团队定价滑块组件</button>
              <button data-q="策划一个 6 人晚餐派对菜单">🍖 晚餐派对菜单</button>
              <button data-q="用一个交互图表对比三种手机套餐">📊 套餐对比图表</button>
              <button data-q="做一个番茄钟工具，能开始暂停重置">🍅 番茄钟工具</button>
            </div>
          </div>
        </div>

        <div class="composer-wrap">
          <form id="composer">
            <input id="input" placeholder="给 sigil-native 发消息" autocomplete="off" />
            <button type="submit" id="send" title="发送">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path
                  d="M12 19V5M5 12l7-7 7 7"
                  stroke="currentColor"
                  stroke-width="2.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </form>
          <p class="disclaimer">界面由模型生成的 Sigil 语言实时编译渲染 · 内容仅供参考</p>
        </div>
      </main>
    </div>
    <script type="module" src="/dist/main.js"></script>
  </body>
</html>
